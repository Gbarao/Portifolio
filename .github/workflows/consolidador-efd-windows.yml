name: Consolidador EFD - executável Windows

on:
  push:
    branches: [claude/pis-cofins-cbs-analysis-2qilkq, main]
    paths:
      - "consolidador-efd/**"
      - ".github/workflows/consolidador-efd-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: consolidador-efd
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Testes de ponta a ponta (Python)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python testes/test_leiautes.py
          python testes/test_consolidador.py

      - name: Gerar o executável
        run: pyinstaller --noconfirm empacotar/consolidador_efd.spec

      - name: Testar a carga pelo executável
        shell: pwsh
        run: |
          python testes/gerar_sinteticos.py "$env:RUNNER_TEMP\dados"
          Remove-Item "$env:RUNNER_TEMP\dados\COPIA*", "$env:RUNNER_TEMP\dados\*utf8*", "$env:RUNNER_TEMP\dados\*OUTRA*", "$env:RUNNER_TEMP\dados\NAO_E_EFD.txt", "$env:RUNNER_TEMP\dados\FISCAL_FILIAL_2026-01.txt"
          & dist\ConsolidadorEFD\ConsolidadorEFD.exe --testar-carga "$env:RUNNER_TEMP\dados" "$env:RUNNER_TEMP\base"
          if ($LASTEXITCODE -ne 0) { throw "A carga pelo executável falhou" }

      - name: Testar a interface do executável
        shell: pwsh
        run: |
          $env:EFD_PORTA = "8790"
          $env:EFD_SEM_NAVEGADOR = "1"
          $env:EFD_BASE = "$env:RUNNER_TEMP\base"
          $p = Start-Process -FilePath dist\ConsolidadorEFD\ConsolidadorEFD.exe -PassThru `
                 -RedirectStandardOutput "$env:RUNNER_TEMP\ui.log" -RedirectStandardError "$env:RUNNER_TEMP\ui_err.log"
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 2
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8790/_stcore/health -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
          }
          Get-Content "$env:RUNNER_TEMP\ui.log", "$env:RUNNER_TEMP\ui_err.log" -ErrorAction SilentlyContinue
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "A interface do executável não respondeu" }

      - name: Montar o pacote
        shell: pwsh
        run: |
          Copy-Item README.md dist\ConsolidadorEFD\LEIA-ME.md
          Copy-Item SEGURANCA.md dist\ConsolidadorEFD\SEGURANCA.md
          Compress-Archive -Path dist\ConsolidadorEFD -DestinationPath ConsolidadorEFD-windows.zip -Force
          $h = (Get-FileHash ConsolidadorEFD-windows.zip -Algorithm SHA256).Hash
          "$h  ConsolidadorEFD-windows.zip" | Out-File -Encoding ascii ConsolidadorEFD-windows.zip.sha256
          Write-Output "SHA-256: $h"

      - uses: actions/upload-artifact@v4
        with:
          name: ConsolidadorEFD-windows
          path: |
            consolidador-efd/ConsolidadorEFD-windows.zip
            consolidador-efd/ConsolidadorEFD-windows.zip.sha256

      - name: Publicar para download (GitHub Releases)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "consolidador-efd-windows"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --prerelease `
              --title "Consolidador EFD para Windows" `
              --notes "Baixe ConsolidadorEFD-windows.zip, extraia e dê duplo clique em ConsolidadorEFD.exe."
          }
          gh release upload $tag ConsolidadorEFD-windows.zip ConsolidadorEFD-windows.zip.sha256 --clobber
