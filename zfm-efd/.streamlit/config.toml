# Execucao 100% local: so aceita conexoes deste computador, sem telemetria.
[server]
address = "127.0.0.1"
headless = true
runOnSave = false
fileWatcherType = "none"
maxUploadSize = 50

[browser]
serverAddress = "127.0.0.1"
gatherUsageStats = false

[client]
showErrorDetails = "none"
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#1E5A8A"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#1F2933"
font = "sans serif"
