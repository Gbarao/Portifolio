[project]
name = "precificacao-reciclagem"
version = "0.1.0"
description = "Sistema de custeio e precificacao para operacoes de reciclagem"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "psycopg[binary]>=3.1; platform_system != 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov", "httpx>=0.27", "pyflakes"]
# Apenas para regenerar o manual em PDF (docs/manual/gerar_manual.py).
docs = ["reportlab>=4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
