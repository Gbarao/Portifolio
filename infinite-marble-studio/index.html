<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Gerador local de animações 3D em loop perfeito com bolinhas em trilhos procedurais."
    />
    <meta name="color-scheme" content="dark" />
    <title>Infinite Marble Studio</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='13' fill='%237c5cff'/%3E%3Ccircle cx='12' cy='12' r='4' fill='%23fff' opacity='.7'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <div id="app" class="app">
      <header id="topbar" class="topbar" role="toolbar" aria-label="Ações principais"></header>
      <main class="workspace">
        <section id="viewport" class="viewport" aria-label="Cena 3D">
          <div id="safe-area" class="safe-area" hidden></div>
          <div id="status-panel" class="status-panel" aria-live="off"></div>
          <div class="drop-hint" aria-hidden="true">
            Solte o arquivo .json para carregar o preset
          </div>
        </section>
        <aside id="sidebar" class="sidebar" aria-label="Painel de controles"></aside>
        <aside id="simple-panel" class="simple-panel" aria-label="Modo simples"></aside>
      </main>
      <div id="toasts" class="toasts" aria-live="polite"></div>
      <dialog id="shortcuts-dialog" class="dialog"></dialog>
      <div id="export-overlay" class="export-overlay" hidden></div>
    </div>
    <noscript>O Infinite Marble Studio precisa de JavaScript habilitado.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
